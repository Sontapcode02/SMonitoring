global:
  scrape_interval: 3s
  evaluation_interval: 3s

scrape_configs:
  # ── 1. Prometheus self-monitoring ──────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── 2. Ubuntu Server Fleet Monitoring Targets ──────────
  - job_name: "ubuntu-server-fleet"
    static_configs:
      - targets: ["192.168.138.128:9100"]
        labels:
          server_name: "ubuntu-server-01"
          role: "web-server"

      - targets: ["192.168.138.129:9100"]
        labels:
          server_name: "ubuntu-server-02"
          role: "db-server"

      - targets: ["192.168.138.130:9100"]
        labels:
          server_name: "ubuntu-server-03"
          role: "app-server"

      - targets: ["192.168.138.131:9100"]
        labels:
          server_name: "ubuntu-server-test"
          role: "test-server"
